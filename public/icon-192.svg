<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#18181b"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#f59e0b"/>
  <!-- Front of Bus icon -->
  <g fill="#18181b" transform="translate(96, 96)">
    <rect x="16" y="24" width="288" height="230" rx="36" fill="#18181b"/>
    <!-- Windshield -->
    <rect x="40" y="56" width="240" height="96" rx="16" fill="#fef3c7"/>
    <!-- Route display -->
    <rect x="100" y="36" width="120" height="14" rx="4" fill="#f59e0b"/>
    <!-- Headlights -->
    <circle cx="64" cy="200" r="22" fill="#ffffff"/>
    <circle cx="256" cy="200" r="22" fill="#ffffff"/>
    <!-- Grill -->
    <line x1="120" y1="195" x2="200" y2="195" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <line x1="130" y1="215" x2="190" y2="215" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <!-- Wheels -->
    <rect x="40" y="250" width="48" height="40" rx="12" fill="#09090b"/>
    <rect x="232" y="250" width="48" height="40" rx="12" fill="#09090b"/>
    <!-- Signal pulse dot -->
    <circle cx="270" cy="40" r="14" fill="#10b981"/>
  </g>
</svg>
