<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<title>Demobondis — composición 1080x1920 (producto + cierre comercial)</title>
<style>
  :root {
    --navy: #1D2B4F;
    --brand-red: #E30613;
    --brand-green: #228135;
    --paper: #0A1020;
    --accent: #7FA0D8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070B14; }
  body { font-family: "Segoe UI", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

  #bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(58% 42% at 50% 26%, rgba(29,43,79,0.92) 0%, rgba(12,18,32,0.98) 62%, #06090F 100%),
      #06090F;
  }
  #glow {
    position: absolute; left: 50%; top: 118px; width: 900px; height: 900px;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(227,6,19,0.10) 0%, rgba(34,129,53,0.05) 45%, rgba(0,0,0,0) 72%);
    filter: blur(6px);
    will-change: transform, opacity;
  }
  #grain {
    position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.9'/></svg>");
  }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }

  #progressTrack { position: absolute; top: 0; left: 0; width: 1080px; height: 4px; background: rgba(255,255,255,0.10); }
  #progressFill { position: absolute; top: 0; left: 0; height: 4px; background: var(--brand-red); width: 0; }

  /* ---------- teléfono ---------- */
  #phone {
    position: absolute; left: 224px; top: 64px; width: 632px; height: 1330px;
    border-radius: 62px;
    background: linear-gradient(160deg, #161C29 0%, #0B101A 100%);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 40px 90px rgba(0,0,0,0.62), 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.04);
    padding: 16px;
    transform-origin: 50% 32%;
    will-change: transform;
  }
  #screen {
    position: relative; width: 600px; height: 1298px; border-radius: 46px;
    overflow: hidden; background: #ffffff;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10);
  }
  #screen video {
    position: absolute; inset: 0; width: 600px; height: 1298px;
    object-fit: cover; display: none;
  }
  #screen video.active { display: block; }
  #screenShade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0.10) 0%, rgba(0,0,0,0) 12%, rgba(0,0,0,0) 88%, rgba(0,0,0,0.12) 100%);
  }

  /* ---------- panel de texto (escenas de producto) ---------- */
  #panel {
    position: absolute; left: 100px; top: 1444px; width: 880px; height: 430px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }
  #kicker {
    font-size: 27px; font-weight: 700; letter-spacing: 0.30em;
    color: var(--brand-red); text-transform: uppercase;
    opacity: 0; transform: translateY(10px);
    margin-bottom: 26px; white-space: nowrap;
  }
  #lines { position: relative; width: 880px; height: 210px; }
  .grp { position: absolute; left: 0; top: 0; width: 880px; visibility: hidden; }
  .grp.active { visibility: visible; }
  .line {
    display: block; color: #FFFFFF; font-weight: 600;
    font-size: 52px; line-height: 1.24; letter-spacing: -0.01em;
    opacity: 0; transform: translateY(26px);
    text-shadow: 0 2px 24px rgba(0,0,0,0.45);
    white-space: nowrap;
  }
  .line.url { font-family: "Cascadia Mono", "Consolas", ui-monospace, monospace; font-size: 40px; letter-spacing: 0; color: #E8ECF4; font-weight: 500; }
  #rule { width: 64px; height: 3px; background: rgba(255,255,255,0.22); margin: 30px auto 0; opacity: 0; }
  #content { position: absolute; inset: 0; }

  /* ---------- tarjetas (bloque comercial) ---------- */
  #card { position: absolute; left: 84px; top: 138px; width: 912px; visibility: hidden; }
  #card.visible { visibility: visible; }
  #cardKicker {
    font-size: 26px; font-weight: 700; letter-spacing: 0.30em; text-transform: uppercase;
    color: var(--brand-red); opacity: 0; transform: translateY(10px);
  }
  #cardHead {
    margin-top: 24px; font-size: 44px; line-height: 1.2; font-weight: 700; color: #FFFFFF;
    letter-spacing: -0.015em; opacity: 0; transform: translateY(16px);
  }
  #cardBig {
    margin-top: 18px; font-size: 116px; font-weight: 800; letter-spacing: -0.035em;
    color: #FFFFFF; opacity: 0; transform: translateY(18px); line-height: 1;
  }
  #cardBig .cur { font-size: 54px; font-weight: 700; color: var(--accent); margin-right: 10px; letter-spacing: 0; }
  #cardSub { margin-top: 14px; font-size: 32px; color: rgba(255,255,255,0.66); opacity: 0; }
  #cardRows { margin-top: 34px; }
  .row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 26px;
    padding: 19px 0; border-bottom: 1px solid rgba(255,255,255,0.10);
    opacity: 0; transform: translateY(18px);
  }
  .row:last-child { border-bottom: none; }
  .rLabel { font-size: 32px; font-weight: 600; color: #E8ECF4; line-height: 1.22; }
  .rLabel .m { font-family: "Cascadia Mono", "Consolas", ui-monospace, monospace; font-size: 27px; color: var(--accent); margin-right: 12px; }
  .rValue {
    font-size: 32px; font-weight: 700; color: var(--accent); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .row.total { border-top: 2px solid rgba(227,6,19,0.55); margin-top: 10px; padding-top: 24px; }
  .row.total .rLabel, .row.total .rValue { color: #FFFFFF; font-size: 36px; font-weight: 800; }
  .row.neg .rValue { color: #FF6B72; }
  .row.step .rLabel .n {
    display: inline-block; width: 42px; height: 42px; line-height: 42px; text-align: center;
    border-radius: 999px; background: rgba(227,6,19,0.16); color: var(--brand-red);
    font-size: 26px; font-weight: 800; margin-right: 16px; vertical-align: 2px;
  }
  #cardFoot {
    margin-top: 30px; font-size: 29px; line-height: 1.34; color: rgba(255,255,255,0.62);
    opacity: 0; transform: translateY(12px);
  }
  #cardFoot.mono { font-family: "Cascadia Mono", "Consolas", ui-monospace, monospace; font-size: 27px; color: #E8ECF4; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="glow"></div>
  <div id="content">
    <div id="phone">
      <div id="screen">
        <div id="screenShade"></div>
      </div>
    </div>
    <div id="panel">
      <div id="kicker"></div>
      <div id="lines"></div>
      <div id="rule"></div>
    </div>
    <div id="card">
      <div id="cardKicker"></div>
      <div id="cardHead"></div>
      <div id="cardBig"></div>
      <div id="cardSub"></div>
      <div id="cardRows"></div>
      <div id="cardFoot"></div>
    </div>
  </div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="progressTrack"></div>
  <div id="progressFill"></div>
</div>

<script>
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const clamp01 = (x) => Math.max(0, Math.min(1, x));

let SCENES = [];
let TOTAL = 0;
let STARTS = [];
let videos = [];
let current = -1;
let chosenFont = {};
const FADE = 0.22;
const MAXW = 880;
const PUSH = 0.028;   // push-in del teléfono: cada frame cambia, nunca slideshow

window.boot = async (cfg) => {
  SCENES = cfg.scenes;
  STARTS = [];
  let acc = 0;
  for (const s of SCENES) { STARTS.push(acc); acc += s.duration; }
  TOTAL = acc;

  const screen = document.getElementById('screen');
  const shade = document.getElementById('screenShade');
  videos = SCENES.map((s, i) => {
    if (!s.clip) return null;
    const v = document.createElement('video');
    v.id = 'v' + i;
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.preload = 'auto';
    screen.insertBefore(v, shade);
    return v;
  });

  await Promise.all(videos.map((v, i) => new Promise((res) => {
    if (!v) return res();
    v.src = '/capture/' + SCENES[i].clip;
    if (v.readyState >= 1) return res();
    v.addEventListener('loadedmetadata', () => res(), { once: true });
    v.addEventListener('error', () => res(), { once: true });
    setTimeout(res, 20000);
  })));

  document.getElementById('lines').innerHTML = SCENES.map((s, i) => {
    if (s.type === 'card') return `<div class="grp" id="G${i}"></div>`;
    return `<div class="grp" id="G${i}">` + s.lines.map((t, j) => {
      const isUrl = /^[a-z0-9.-]+\.(app|com|ar|dev)$/i.test(t.trim());
      return `<span class="line${isUrl ? ' url' : ''}" id="L${i}_${j}">${t}</span>`;
    }).join('') + '</div>';
  }).join('');
  document.getElementById('G0').classList.add('active');

  for (let i = 0; i < SCENES.length; i++) {
    if (SCENES[i].type === 'card') { chosenFont[i] = null; continue; }
    let size = 52;
    for (; size >= 38; size -= 1) {
      let ok = true;
      SCENES[i].lines.forEach((_, j) => {
        const el = document.getElementById(`L${i}_${j}`);
        el.style.fontSize = (el.classList.contains('url') ? Math.round(size * 0.78) : size) + 'px';
        if (el.scrollWidth > MAXW) ok = false;
      });
      if (ok) break;
    }
    chosenFont[i] = size;
  }
  return { total: TOTAL, scenes: SCENES.map((s, i) => ({ n: s.n, type: s.type || 'product', start: STARTS[i], duration: s.duration, font: chosenFont[i] })) };
};

const seek = (v, t) => new Promise((res) => {
  const target = Math.max(0, Math.min(t, (v.duration || 1e9) - 0.04));
  if (Math.abs(v.currentTime - target) < 0.004 && v.readyState >= 2) return res();
  let done = false;
  const finish = () => { if (done) return; done = true; res(); };
  v.addEventListener('seeked', finish, { once: true });
  try { v.currentTime = target; } catch (e) { finish(); }
  setTimeout(finish, 1200);
});

const locate = (t) => {
  for (let i = SCENES.length - 1; i >= 0; i--) {
    if (t >= STARTS[i] - 1e-6) return { i, local: Math.min(t - STARTS[i], SCENES[i].duration) };
  }
  return { i: 0, local: 0 };
};

function renderCard(s, i, local) {
  document.getElementById('cardKicker').textContent = s.kicker || '';
  const head = document.getElementById('cardHead');
  head.innerHTML = (s.head || '').replace(/`([^`]+)`/g, '<span style="color:#7FA0D8">$1</span>');
  head.style.display = s.head ? 'block' : 'none';

  const big = document.getElementById('cardBig');
  if (s.big) { big.innerHTML = s.big; big.style.display = 'block'; } else { big.innerHTML = ''; big.style.display = 'none'; }

  const sub = document.getElementById('cardSub');
  if (s.sub) { sub.textContent = s.sub; sub.style.display = 'block'; } else { sub.textContent = ''; sub.style.display = 'none'; }

  const rowsEl = document.getElementById('cardRows');
  if (s.rows && s.rows.length) {
    rowsEl.innerHTML = s.rows.map((r, j) => {
      const cls = ['row', r.kind || ''].join(' ').trim();
      const label = `<span class="rLabel">${r.n ? `<span class="n">${r.n}</span>` : ''}${r.m ? `<span class="m">${r.m}</span>` : ''}${r.l}</span>`;
      const value = r.r ? `<span class="rValue">${r.r}</span>` : '';
      return `<div class="${cls}" id="R${i}_${j}">${label}${value}</div>`;
    }).join('');
    rowsEl.style.display = 'block';
  } else {
    rowsEl.innerHTML = '';
    rowsEl.style.display = 'none';
  }

  const foot = document.getElementById('cardFoot');
  if (s.foot) {
    foot.innerHTML = s.foot;
    foot.style.display = 'block';
    foot.className = s.footMono ? 'mono' : '';
  } else { foot.innerHTML = ''; foot.style.display = 'none'; }

  const kp = easeOut(clamp01((local - 0.06) / 0.34));
  const ck = document.getElementById('cardKicker');
  ck.style.opacity = kp;
  ck.style.transform = `translateY(${(1 - kp) * 10}px)`;

  const hp = easeOut(clamp01((local - 0.20) / 0.42));
  head.style.opacity = hp;
  head.style.transform = `translateY(${(1 - hp) * 16}px)`;

  const bp = easeOut(clamp01((local - 0.28) / 0.46));
  big.style.opacity = bp;
  big.style.transform = `translateY(${(1 - bp) * 18}px)`;

  const sp = easeOut(clamp01((local - 0.40) / 0.42));
  sub.style.opacity = sp;

  const rows = s.rows || [];
  const base = s.big ? 0.75 : 0.60;
  const step = rows.length ? Math.min(1.7, (s.duration * 0.55) / rows.length) : 0.16;
  rows.forEach((_, j) => {
    const el = document.getElementById(`R${i}_${j}`);
    if (!el) return;
    const p = easeOut(clamp01((local - (base + j * step)) / 0.45));
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 22}px)`;
  });

  const footStart = base + rows.length * step + 0.30;
  const fp = easeOut(clamp01((local - footStart) / 0.45));
  foot.style.opacity = fp * 0.95;
  foot.style.transform = `translateY(${(1 - fp) * 12}px)`;
}

window.setTime = async (t) => {
  const { i, local } = locate(t);
  const s = SCENES[i];
  const isCard = s.type === 'card';

  if (current !== i) {
    videos.forEach((v, k) => { if (v) v.classList.toggle('active', k === i); });
    SCENES.forEach((_, k) => {
      const g = document.getElementById('G' + k);
      if (g) g.classList.toggle('active', k === i);
    });
    document.getElementById('card').classList.toggle('visible', isCard);
    document.getElementById('phone').style.display = isCard ? 'none' : 'block';
    document.getElementById('panel').style.display = isCard ? 'none' : 'flex';
    document.getElementById('kicker').textContent = isCard ? '' : s.kicker;
    current = i;
  }

  document.getElementById('progressFill').style.width = Math.round((t / TOTAL) * 1080) + 'px';

  const fadeIn = clamp01(local / FADE);
  const fadeOut = clamp01((s.duration - local) / FADE);
  const edge = i === SCENES.length - 1 ? fadeIn : Math.min(fadeIn, fadeOut);
  document.getElementById('content').style.opacity = 0.16 + 0.84 * easeOut(edge);

  const gp = clamp01(local / s.duration);
  const glow = document.getElementById('glow');
  glow.style.opacity = 0.55 + 0.45 * Math.sin(gp * Math.PI);
  glow.style.transform = `translateX(-50%) translateY(${-40 + gp * 80}px) scale(${0.96 + gp * 0.08})`;

  if (isCard) {
    renderCard(s, i, local);
    const card = document.getElementById('card');
    card.style.transform = `translateY(${-6 + gp * 12}px) scale(${1 + gp * 0.006})`;
    return { i, local };
  }

  await seek(videos[i], s.trimStart + local);

  const phone = document.getElementById('phone');
  phone.style.transform = `scale(${1 + PUSH * gp}) translateY(${-10 * gp}px)`;

  const kp = easeOut(clamp01((local - 0.12) / 0.34));
  const kick = document.getElementById('kicker');
  kick.style.opacity = kp;
  kick.style.transform = `translateY(${(1 - kp) * 10}px)`;

  s.lines.forEach((_, j) => {
    const el = document.getElementById(`L${i}_${j}`);
    const start = 0.30 + j * 0.16;
    const p = easeOut(clamp01((local - start) / 0.40));
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 26}px)`;
  });

  const rp = easeOut(clamp01((local - 0.30 - s.lines.length * 0.16) / 0.40));
  const rule = document.getElementById('rule');
  rule.style.opacity = rp * 0.9;
  rule.style.transform = `translateX(${(1 - rp) * -20}px)`;
  return { i, local };
};

window.measure = () => {
  const out = { ok: true, problems: [], scenes: [] };
  for (let i = 0; i < SCENES.length; i++) {
    const s = SCENES[i];
    if (s.type === 'card') {
      document.getElementById('card').classList.add('visible');
      renderCard(s, i, s.duration - 0.05);
      const cr = document.getElementById('card').getBoundingClientRect();
      out.scenes.push({ n: s.n, type: 'card', top: Math.round(cr.top), bottom: Math.round(cr.bottom), rows: (s.rows || []).length });
      const nodes = [
        ['kicker', document.getElementById('cardKicker')],
        ['head', document.getElementById('cardHead')],
        ['big', document.getElementById('cardBig')],
        ['sub', document.getElementById('cardSub')],
        ['foot', document.getElementById('cardFoot')],
        ...(s.rows || []).map((_, j) => [`row ${j}`, document.getElementById(`R${i}_${j}`)]),
      ];
      for (const [label, el] of nodes) {
        if (!el || el.style.display === 'none') continue;
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) continue;
        if (r.left < 40 || r.right > 1044) { out.ok = false; out.problems.push(`scene ${s.n} ${label}: desborde horizontal (${Math.round(r.left)}..${Math.round(r.right)})`); }
        if (r.bottom > 1884) { out.ok = false; out.problems.push(`scene ${s.n} ${label}: desborde inferior (${Math.round(r.bottom)})`); }
        if (r.top < 60) { out.ok = false; out.problems.push(`scene ${s.n} ${label}: desborde superior (${Math.round(r.top)})`); }
      }
      continue;
    }
    const kick = document.getElementById('kicker');
    kick.textContent = s.kicker;
    const info = { n: s.n, type: 'product', font: chosenFont[i], lines: [], kicker: null };
    const kr = kick.getBoundingClientRect();
    info.kicker = { x: Math.round(kr.left), w: Math.round(kr.width) };
    if (kr.left < 40 || kr.right > 1040) { out.ok = false; out.problems.push(`scene ${s.n}: kicker fuera de márgenes`); }
    const phoneBottom = document.getElementById('phone').getBoundingClientRect().bottom;
    s.lines.forEach((_, j) => {
      const el = document.getElementById(`L${i}_${j}`);
      const r = el.getBoundingClientRect();
      const rec = { j, left: Math.round(r.left), right: Math.round(r.right), top: Math.round(r.top), bottom: Math.round(r.bottom) };
      info.lines.push(rec);
      if (rec.left < 40 || rec.right > 1040) { out.ok = false; out.problems.push(`scene ${s.n} line ${j}: desborde horizontal (${rec.left}..${rec.right})`); }
      if (rec.bottom > 1896) { out.ok = false; out.problems.push(`scene ${s.n} line ${j}: desborde inferior (${rec.bottom})`); }
      if (rec.top < phoneBottom + 6) { out.ok = false; out.problems.push(`scene ${s.n} line ${j}: solapa el teléfono (top ${rec.top} <= ${Math.round(phoneBottom)})`); }
    });
    out.scenes.push(info);
  }
  document.getElementById('card').classList.remove('visible');
  return out;
};

let cfgFps = 30;
window.setFps = (f) => { cfgFps = f; };
window.meta = () => ({
  total: TOTAL,
  fps: cfgFps,
  frames: Math.round(TOTAL * cfgFps),
  phoneBottom: Math.round(document.getElementById('phone').getBoundingClientRect().bottom),
  cards: SCENES.filter((s) => s.type === 'card').length,
  products: SCENES.filter((s) => s.type !== 'card').length,
});
</script>
</body>
</html>
